version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ejustice-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ejustice
      POSTGRES_PASSWORD: ejustice_password_change_in_production
      POSTGRES_DB: ejustice
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ejustice"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ejustice-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://ejustice:ejustice_password_change_in_production@postgres:5432/ejustice?schema=public
      - NODE_ENV=development
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    command: npm run dev

volumes:
  postgres_data:
